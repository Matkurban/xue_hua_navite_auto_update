name: xue_hua_navite_auto_update
description: "Flutter desktop auto-update plugin for macOS, Windows, and Linux with native progress UI, elevation, and rollback."
version: 1.0.1
homepage: https://github.com/Matkurban/xue_hua_navite_auto_update
repository: https://github.com/Matkurban/xue_hua_navite_auto_update
issue_tracker: https://github.com/Matkurban/xue_hua_navite_auto_update/issues

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

topics:
  - auto-update
  - desktop
  - installer
  - macos
  - windows

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      linux:
        pluginClass: XueHuaNaviteAutoUpdatePlugin
      macos:
        pluginClass: XueHuaNaviteAutoUpdatePlugin
      windows:
        pluginClass: XueHuaNaviteAutoUpdatePluginCApi
